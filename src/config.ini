[Database]
server_dir = ./db

[User]
; username は設定不要。OSのログイン名(USERNAME または USER 環境変数)を自動取得して使用する
members = id001, id002, id003, id004

[DisplayNames]
; OSログイン名(またはユーザーID) = 表示名　の形式で記載する
id001 = 山田
id002 = 田中
id003 = 鈴木
id004 = 斎藤

[GUI]
window_width = 1500
window_height = 900
font_size = 9

[Schedule]
daily_begin_time = 6
daily_end_time = 21
daily_task_hour = 5
holidays = SUN,SAT

[DailyInfoCombo]
health_status = Good, Bad
work_place = Office, Home
safety = OK, NG
overwork = No, Yes

[Commands]
command_01_label = サンプルコマンド
command_01_script = scripts/sample.py
